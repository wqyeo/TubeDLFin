<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>TubeDLFin</title>
</head>
<body>
    <div id="TubeDLFinPage" data-role="page" class="page type-interior pluginConfigurationPage"
        data-controller="__plugin/tubedlfin.js">
        <div data-role="content">
            <div class="content-primary">
                <div class="verticalSection">
                    <div class="sectionTitleContainer flex align-items-center">
                        <h2 class="sectionTitle">TubeDLFin</h2>
                    </div>
                    <p>Download videos and music with yt-dlp straight into your Jellyfin libraries.</p>
                </div>

                <div class="verticalSection">
                    <h3 class="sectionTitle">Status</h3>
                    <dl class="tubedlfin-info" data-tubedlfin="info-list"></dl>
                    <p class="tubedlfin-error" data-tubedlfin="info-error" hidden></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
