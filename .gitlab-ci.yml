# Kept small on purpose (CI minutes are limited):
# - one "build" job does everything: web lint/type check, dotnet build (which also bundles web/), tests
# - runs only for main, merge requests and tags, and not when only docs changed
# - the plugin zip is only built for version tags

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true

variables:
  NODE_VERSION: "24.22.0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.cache/nuget
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm

.node: &install-node
  - curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.gz" | tar -xz -C /opt
  - export PATH="/opt/node-v$NODE_VERSION-linux-x64/bin:$PATH"

build:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - src/**/*
        - tests/**/*
        - web/**/*
        - "*.{props,slnx,json,yaml,yml}"
  cache:
    key:
      files: [Directory.Packages.props, web/package-lock.json]
    paths: [.cache/]
  before_script: *install-node
  script:
    - (cd web && npm ci --no-audit --no-fund && npm run check)
    - dotnet build --configuration Release
    - dotnet test --configuration Release --no-build

package:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  cache:
    key:
      files: [Directory.Packages.props, web/package-lock.json]
    paths: [.cache/]
    policy: pull
  before_script:
    - *install-node
    - apt-get update -qq && apt-get install -y -qq python3-venv >/dev/null
    - python3 -m venv /opt/jprm && /opt/jprm/bin/pip install -q "jprm==1.1.0"
  script:
    - mkdir -p artifacts
    - /opt/jprm/bin/jprm plugin build . --output artifacts
  artifacts:
    paths: [artifacts/*.zip]
    expire_in: 30 days
