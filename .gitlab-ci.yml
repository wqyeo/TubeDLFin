# Kept small on purpose (CI minutes are limited):
# - one "build" job does everything: web lint/type check, dotnet build (which also bundles web/), tests
# - runs only for main, merge requests and tags, and not when only docs changed
# - a version tag also publishes the release: "package" builds the zip and uploads it to the
#   package registry, "release" creates the GitLab Release, "pages" adds the version to the plugin
#   repository manifests on GitLab Pages. vX.Y.Z goes to both manifests, vX.Y.Z-beta.N only to the
#   beta one (see docs/RELEASING.md)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  interruptible: true

variables:
  NODE_VERSION: "24.22.0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: $CI_PROJECT_DIR/.cache/nuget
  npm_config_cache: $CI_PROJECT_DIR/.cache/npm
  PAGES_URL: https://wqyeo.gitlab.io/jellyfin-plugin-tubedlfin

.node: &install-node
  - curl -fsSL "https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.gz" | tar -xz -C /opt
  - export PATH="/opt/node-v$NODE_VERSION-linux-x64/bin:$PATH"

build:
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - changes:
        - src/**/*
        - tests/**/*
        - web/**/*
        - "*.{props,slnx,json,yaml,yml}"
  cache:
    key:
      files: [Directory.Packages.props, web/package-lock.json]
    paths: [.cache/]
  before_script: *install-node
  script:
    - (cd web && npm ci --no-audit --no-fund && npm run check)
    - dotnet build --configuration Release
    - dotnet test --configuration Release --no-build

package:
  stage: deploy
  needs: [build]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/
  cache:
    key:
      files: [Directory.Packages.props, web/package-lock.json]
    paths: [.cache/]
    policy: pull
  before_script:
    - *install-node
    - apt-get update -qq && apt-get install -y -qq python3-venv >/dev/null
    - python3 -m venv /opt/jprm && /opt/jprm/bin/pip install -q "jprm==1.1.0"
  script:
    - PROPS_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
    - |
      GUID="$(sed -n 's/^guid: *"\(.*\)"/\1/p' build.yaml)"
    - >
      VERSION="$(node web/release/release-version.mjs --tag "$CI_COMMIT_TAG"
      --props-version "$PROPS_VERSION" --guid "$GUID" --pages-url "$PAGES_URL")"
    - node web/release/release-notes.mjs CHANGELOG.md "$CI_COMMIT_TAG" > release-notes.md
    - mkdir -p artifacts
    - /opt/jprm/bin/jprm plugin build . --output artifacts
    - ZIP="tubedlfin_$VERSION.zip"
    - >
      curl --fail-with-body --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file "artifacts/$ZIP"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/tubedlfin/$VERSION/$ZIP"
    - echo "VERSION=$VERSION" > release.env
    - echo "ZIP_URL=$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/tubedlfin/$VERSION/$ZIP" >> release.env
  artifacts:
    paths: [artifacts/, release-notes.md]
    reports:
      dotenv: release.env
    expire_in: 30 days

release:
  stage: deploy
  needs: [package]
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/
  script:
    - echo "Releasing TubeDLFin $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: TubeDLFin $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: tubedlfin_$VERSION.zip
          url: $ZIP_URL
          link_type: package

pages:
  stage: deploy
  needs: [package]
  image: docker.io/library/node:24-alpine
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-beta\.\d+)?$/
  script:
    - mkdir -p public
    - cp docs/images/logo.png public/logo.png
    - >
      node web/release/publish-manifest.mjs
      --tag "$CI_COMMIT_TAG"
      --zip "artifacts/tubedlfin_$VERSION.zip"
      --source-url "$ZIP_URL"
      --changelog CHANGELOG.md
      --pages-url "$PAGES_URL"
      --image-url "$PAGES_URL/logo.png"
      --out-dir public
  artifacts:
    paths: [public/]
